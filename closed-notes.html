<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas Cerradas</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>Notas cerradas</h1>
            <div class="header-actions">
                <button id="notesListBtn" class="icon-btn notes-list-btn" title="Lista de notas">
                    <i data-lucide="list"></i>
                </button>
            </div>
        </div>
        
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar...">
            <span class="search-icon"><i data-lucide="search"></i></span>
        </div>

        <div class="notes-list" id="notesList">
            <!-- Las notas cerradas se cargarán aquí dinámicamente -->
        </div>
    </div>

    <!-- Modal de confirmación de eliminación -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Eliminar nota</h3>
            </div>
            <div class="modal-body">
                <p>¿Estás seguro de que quieres eliminar esta nota?</p>
                <p class="modal-warning">Esta acción no se puede deshacer.</p>
            </div>
            <div class="modal-footer">
                <button id="modalCancelBtn" class="modal-btn modal-btn-secondary">Cancelar</button>
                <button id="modalConfirmBtn" class="modal-btn modal-btn-danger">Eliminar</button>
            </div>
        </div>
    </div>

    <script src="closed-notes-renderer.js"></script>
    <script>
        // Inicializar Lucide Icons
        lucide.createIcons();
    </script>
</body>
</html>
